name: codex+typeless
description: codex + typeless 场景（含摇杆控鼠标）
bindings:
  A: return
  B: escape
  Y:                       # 退格，长按连续删除
    keys: backspace
    repeat: true
  R:
    action: mouse_rightclick  # 鼠标右键（需辅助功能授权）
  L:
    action: mouse_click       # 鼠标左键（需辅助功能授权）
  ZR: ctrl+right         # 右切屏幕（需系统启用「移到右边一个空间」⌃→）
  ZL: ctrl+left          # 左切屏幕（需系统启用「移到左边一个空间」⌃←）
  Home: ctrl+up          # 调度中心 / Mission Control
  Capture: cmd+shift+5   # 截图工具栏
  dpad_up: up            # 默认方向键模式：键盘 ↑
  dpad_down: down        # 默认方向键模式：键盘 ↓
  dpad_right: right      # 默认方向键模式：键盘 →
  dpad_left: left        # 默认方向键模式：键盘 ←
  L3:
    keys: cmd+tab          # 切 App
  R3: cmd+space            # Spotlight
  # 右修饰键 / 纯修饰键：用 Quartz 按精确键码发送（右Option=61, 右Shift=60）
  X: roption               # 单独右 Option
  Plus: alt+cmd+n          # ⌥⌘N — codex 创建新会话
  Minus: roption+rshift    # 右 Option + 右 Shift
dpad_modes:
  toggle: [L, R]            # 同时按 L+R 切换实体方向键模式
  repeat:
    delay: 0.35             # 按住方向键多久后开始连发
    interval: 0.08          # 连发间隔
  alternate:
    dpad_up: shift+cmd+[    # 原快捷键模式：上一个面板/标签组
    dpad_down: shift+cmd+]  # 原快捷键模式：下一个面板/标签组
    dpad_right: ctrl+tab    # 下一个 tab
    dpad_left: ctrl+shift+tab # 上一个 tab
sticks:
  left:
    mode: mouse            # 左摇杆控制鼠标移动（warp，无需授权）
    speed: 900             # 像素/秒，可调
    deadzone: 0.22
    settle: 0.8             # 连接/重载后先忽略摇杆抖动
    center_max: 0.35        # 静止中心漂移在此范围内会被归零
    center_stability: 0.12  # 采样足够稳定才采用中心归零
    recenter_after: 0.6     # 强推动后释放且稳定时重新归零
    active_threshold: 0.55
  right:
    mode: scroll           # 右摇杆滚动页面/列表
    speed: 900             # 像素/秒，可调
    deadzone: 0.10
    deadzone_x: 0.16       # 横向阈值稍高，保留横向滚动但挡住抖动
    deadzone_y: 0.10       # 纵向滚动保持灵敏
    horizontal: true
    settle: 0.8
    center_max: 0.35
    center_stability: 0.12
    recenter_after: 0.6
    active_threshold: 0.55
